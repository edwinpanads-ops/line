<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>連接中...</title>
    <style>
        body {
            background-color: #f9f7f5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
            color: #8c8c8c;
        }
        .loader {
            border: 3px solid #e0e0e0;
            border-top: 3px solid #cfa387;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { font-size: 14px; letter-spacing: 1px; }
        #error-msg { display: none; color: #d9534f; margin-top: 20px; font-size: 12px; padding: 0 20px; text-align: center; line-height: 1.5; }
    </style>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>

    <div class="loader"></div>
    <p id="status-text">正在為您連接 LINE...</p>
    <div id="error-msg"></div>

    <script>
        // ==========================================
        //  【設定區域】請填入你的 ID
        //  這支頁面是 opt-in 網站(skincover-experience)
        //  「加line預約諮詢」按鈕的新目的地，用來在使用者
        //  離開網站、進入 LINE 之前，把 Meta 的 fbc/fbp
        //  跟 LINE User ID 綁在一起，送進 Make.com 存起來。
        // ==========================================

        const MY_LIFF_ID = '2008869736-7LQHYI0l';
        const LINE_OA_ID = '@306ebtoz';
        const KEYWORD = '預約諮詢';
        const MAKE_WEBHOOK_URL = 'https://hook.eu2.make.com/ogfnijilfpat5oereykmtyuqh7gxe46v';

        // ==========================================
        //  【核心邏輯】
        // ==========================================

        window.onload = function () {
            main();
        };

        async function main() {
            try {
                if (typeof liff === 'undefined') {
                    throw new Error('LIFF SDK 載入失敗，請檢查網路連線或阻擋廣告軟體。');
                }

                // 從網址取出 opt-in 頁傳過來的 fbc / fbp
                const urlParams = new URLSearchParams(window.location.search);
                const fbc = urlParams.get('fbc') || '';
                const fbp = urlParams.get('fbp') || '';

                await liff.init({ liffId: MY_LIFF_ID });

                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                const profile = await liff.getProfile();
                const userId = profile.userId;
                const displayName = profile.displayName;

                // 把 fbc/fbp 跟 LINE User ID 存進 Make.com，以 userId 當 key，
                // 之後 SimplyMeet 預約完成時，Make.com 會用同一個 userId 查回 fbc/fbp
                if (MAKE_WEBHOOK_URL.indexOf('http') === 0) {
                    try {
                        await fetch(MAKE_WEBHOOK_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                line_user_id: userId,
                                nickname: displayName,
                                fbc: fbc,
                                fbp: fbp,
                                page_url: window.location.href,
                                timestamp: new Date().toISOString()
                            })
                        });
                    } catch (e) {
                        console.error('Make webhook error', e);
                        // 存資料失敗也不卡住使用者的流程
                    }
                }

                // 跟 index.html 的 action=trigger 邏輯一致：
                // 優先在 LINE 內自動發送預約關鍵字，失敗才退回預填訊息連結
                if (liff.isInClient()) {
                    try {
                        await liff.sendMessages([{ type: 'text', text: KEYWORD }]);
                        liff.closeWindow();
                        return;
                    } catch (e) {
                        // 自動發送失敗，往下退回 oaMessage 連結
                    }
                }
                window.location.href = `https://line.me/R/oaMessage/${LINE_OA_ID}/?${encodeURIComponent(KEYWORD)}`;

            } catch (err) {
                showError('系統錯誤：' + err.message);
            }
        }

        function showError(msg) {
            document.querySelector('.loader').style.display = 'none';
            document.getElementById('status-text').style.display = 'none';
            const errDiv = document.getElementById('error-msg');
            errDiv.style.display = 'block';
            errDiv.innerText = msg;
        }
    </script>
</body>
</html>
